# Sample Debezium Server config — local Docker test environment.
# Generated by fluxaorm's GenerateDebeziumServerProperties() for the `default` MySQL pool.
# In production you would write this file from the output of:
#   props, _ := fluxaorm.GenerateDebeziumServerProperties(ctx)
#   // serialize `props["default"]` to application.properties

debezium.source.connector.class=io.debezium.connector.mysql.MySqlConnector
debezium.source.tasks.max=1
debezium.source.database.hostname=mysql
debezium.source.database.port=3306
debezium.source.database.user=root
debezium.source.database.password=root
debezium.source.database.server.id=42
debezium.source.topic.prefix=fluxa_default
debezium.source.database.include.list=test
debezium.source.table.include.list=test.debeziumTestEntity,test.generateEntityDebezium
debezium.source.include.schema.changes=false

# Offset storage — Redis-backed for HA / durability
debezium.source.offset.storage=io.debezium.storage.redis.offset.RedisOffsetBackingStore
debezium.source.offset.storage.redis.address=redis:6379
debezium.source.offset.storage.redis.key=fluxa:dbz:default:offsets

# Schema history — Redis-backed
debezium.source.schema.history.internal=io.debezium.storage.redis.history.RedisSchemaHistory
debezium.source.schema.history.internal.redis.address=redis:6379
debezium.source.schema.history.internal.redis.key=fluxa:dbz:default:history

# Output format — native Debezium JSON envelope (matches fluxaorm's `ParseDebeziumEvent`)
debezium.format.key=json
debezium.format.key.schemas.enable=false
debezium.format.value=json
debezium.format.value.schemas.enable=false

# Sink — NATS JetStream
debezium.sink.type=nats-jetstream
debezium.sink.nats-jetstream.url=nats://nats:4222
# fluxaorm owns stream creation/tuning via GetNatsAlters — do NOT let Debezium create the stream.
debezium.sink.nats-jetstream.create-stream=false

# Quarkus logging (optional)
quarkus.log.console.json=false
quarkus.log.level=INFO
