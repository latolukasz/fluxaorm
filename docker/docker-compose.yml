services:
  mysql:
    image: mysql/mysql-server:8.0
    volumes:
      - orm_volume_mysql:/var/lib/mysql
    ports:
      - ${LOCAL_IP}:${MYSQL_PORT}:3306
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: test
      MYSQL_ROOT_HOST: "%"
  redis:
    image: redis:8.6
    ports:
      - ${LOCAL_IP}:${REDIS_PORT}:6379
    volumes:
      - orm_volume_redis:/data
  clickhouse:
    image: clickhouse/clickhouse-server:24
    ports:
      - ${LOCAL_IP}:${CLICKHOUSE_PORT}:9000
      - ${LOCAL_IP}:${CLICKHOUSE_HTTP_PORT}:8123
    volumes:
      - orm_volume_clickhouse:/var/lib/clickhouse
  kafka:
    image: apache/kafka:latest
    ports:
      - ${LOCAL_IP}:${KAFKA_PORT}:9092
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:${KAFKA_PORT}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_GROUP_COORDINATOR_REBALANCE_PROTOCOLS: "classic,consumer"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      CLUSTER_ID: "ORM-kafka-test-cluster-1"
    volumes:
      - orm_volume_kafka:/var/kafka/kafka-logs
volumes:
  orm_volume_mysql: {}
  orm_volume_redis: {}
  orm_volume_clickhouse: {}
  orm_volume_kafka: {}
